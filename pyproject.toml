[project]
name = "triage-chsa"
version = "0.1.0"
description = "POC d'un agent IA de triage médical pour le CHSA : Qwen3-1.7B fine-tuné (SFT + LoRA), aligné (DPO), servi par vLLM"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Socle léger : l'API de démonstration. vLLM n'est pas une dépendance Python du projet :
# il tourne dans son propre conteneur et l'API lui parle en HTTP (format OpenAI).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Étape 1 : préparation des données et anonymisation.
data = [
    "datasets>=3.0",
    "pandas>=2.2",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "fr-core-news-md @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]
# Étape 2 : à installer sur la machine GPU (pas de GPU sur le poste local).
train = [
    "datasets>=3.0",
    "torch>=2.5",
    "transformers>=4.51",        # en dessous : KeyError 'qwen3'
    "peft>=0.14",
    "trl>=0.19",
    "accelerate>=1.0",
    "wandb>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]
