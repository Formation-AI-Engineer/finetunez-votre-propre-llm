# Point de départ à ajuster après les petits runs de validation (étape 2).
sft_adapter: outputs/sft/sft-r16-lr2e-4/best  # adaptateur SFT retenu (à confirmer après comparaison)
seed: 42
training:
  beta: 0.1
  learning_rate: 1.0e-5
  num_train_epochs: 1
  per_device_train_batch_size: 4
  max_length: 1024
  loss_type: [sigmoid]
