# Point de départ à ajuster après les petits runs de validation (étape 2).
model_id: Qwen/Qwen3-1.7B-Base
seed: 42
# Dataset privé sur le Hub, à une révision fixe (contenu vérifié contre data/processed/build_log.json).
dataset:
  repo_id: lcamara/triage-chsa
  revision: c6d370f92ca464d172152960329d41352088bf98
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
training:
  learning_rate: 2.0e-4
  num_train_epochs: 3
  per_device_train_batch_size: 8
  max_length: 1024
  eval_strategy: steps
  save_total_limit: 3
  load_best_model_at_end: true
